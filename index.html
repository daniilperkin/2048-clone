<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>2048</title>

    <link href="style/main.css" rel="stylesheet" type="text/css" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="meta/apple-touch-icon.png" />
    <link
      rel="apple-touch-startup-image"
      href="meta/apple-touch-startup-image-640x1096.png"
      media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"
    />
    <!-- iPhone 5+ -->
    <link
      rel="apple-touch-startup-image"
      href="meta/apple-touch-startup-image-640x920.png"
      media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 2)"
    />
    <!-- iPhone, retina -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta name="HandheldFriendly" content="True" />
    <meta name="MobileOptimized" content="320" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#faf8ef" />
  </head>
  <body>
    <noscript>
      <p style="text-align: center; margin: 2em; font-family: system-ui, sans-serif">
        2048 requires JavaScript to run. Please enable JavaScript in your browser settings to play.
      </p>
    </noscript>
    <div class="container">
      <div class="heading">
        <div class="scores-container" role="group" aria-label="Scores">
          <div class="score-container" role="status" aria-label="Current score">0</div>
          <div class="best-container" role="status" aria-label="Best score">0</div>
        </div>
      </div>

      <div class="above-game">
        <div class="above-game-controls">
          <select class="theme-select" aria-label="Change tile theme"></select>
          <button
            class="sound-toggle"
            type="button"
            aria-pressed="false"
            aria-label="Sound effects"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M4 9h3.2L11.5 6v12L7.2 15H4z" fill="currentColor" />
              <path
                class="sound-waves"
                d="M15.2 8.6a5 5 0 0 1 0 6.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                class="sound-slash"
                d="M4.5 19.5 19.5 4.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            class="undo-button"
            type="button"
            disabled
            aria-label="Undo last move"
            aria-keyshortcuts="U Control+Z Meta+Z"
          >
            Undo
          </button>
          <button
            class="daily-button"
            type="button"
            aria-pressed="false"
            aria-label="Daily challenge"
          >
            Daily
          </button>
          <button
            class="stats-button"
            type="button"
            aria-expanded="false"
            aria-controls="stats-panel"
            aria-label="Statistics"
          >
            Stats
          </button>
          <a class="restart-button" href="#" role="button" aria-label="Start a new game"
            >New Game</a
          >
        </div>
      </div>

      <div class="stats-panel" id="stats-panel" role="region" aria-label="Statistics" hidden>
        <dl class="stats-list">
          <div class="stat">
            <dt>Played</dt>
            <dd class="stat-played">0</dd>
          </div>
          <div class="stat">
            <dt>Won</dt>
            <dd class="stat-won">0</dd>
          </div>
          <div class="stat">
            <dt>Win rate</dt>
            <dd class="stat-rate">0%</dd>
          </div>
          <div class="stat">
            <dt>Best tile</dt>
            <dd class="stat-best-tile">—</dd>
          </div>
          <div class="stat">
            <dt>Best streak</dt>
            <dd class="stat-best-streak">0</dd>
          </div>
        </dl>
      </div>

      <div class="game-container">
        <div class="game-message" role="alert" aria-live="assertive" aria-atomic="true">
          <p></p>
          <div class="lower">
            <a
              class="keep-playing-button"
              href="#"
              role="button"
              aria-label="Keep playing after winning"
              >Keep going</a
            >
            <a class="retry-button" href="#" role="button" aria-label="Start a new game"
              >Try again</a
            >
            <button class="share-button" type="button" aria-label="Share result">Share</button>
          </div>
        </div>

        <div class="grid-container" role="grid" aria-label="2048 game board">
          <div class="grid-row" role="row">
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
          </div>
          <div class="grid-row" role="row">
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
          </div>
          <div class="grid-row" role="row">
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
          </div>
          <div class="grid-row" role="row">
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
          </div>
        </div>

        <div class="tile-container"></div>
      </div>
    </div>

    <script src="js/directions.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/view_transitions.js"></script>
    <script src="js/sound_manager.js"></script>
    <script src="js/keyboard_input_manager.js"></script>
    <script src="js/html_actuator.js"></script>
    <script src="js/tile.js"></script>
    <script src="js/random.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/local_storage_manager.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/share.js"></script>
    <script src="js/game_manager.js"></script>
    <script src="js/application.js"></script>
  </body>
</html>
