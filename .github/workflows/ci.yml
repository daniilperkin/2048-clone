name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight runs for the same ref: a rapid series of pushes (or a
# dependabot rebase) should not queue redundant jobs on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (lint, format, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Lint CSS
        run: npm run lint:css

      - name: Type-check the plain-JS sources
        run: npm run typecheck

      - name: Run tests with coverage thresholds
        run: npm run coverage

      - name: Build single-file bundle
        run: npm run build

      # The bundle is gitignored, so the artifact upload is how a built
      # 2048.html is retrieved from CI without running the build locally.
      - name: Upload single-file bundle
        uses: actions/upload-artifact@v7
        with:
          name: 2048-single-file-bundle
          path: 2048.html
          if-no-files-found: error
          retention-days: 14

  # jsdom cannot catch layout, timing or real-browser API regressions (the
  # 4 s view-transition deadlock proved that), so one Chromium smoke test
  # runs against the served multi-file build.
  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:e2e
