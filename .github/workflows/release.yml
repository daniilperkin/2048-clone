name: Release

# Tag a release with:  git tag v1.0.0 && git push origin v1.0.0
# 2048.html is gitignored, so a release is where the built single-file
# bundle becomes a downloadable artifact.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the single-file bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A release must not ship a broken bundle: run the same gate as CI.
      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run tests with coverage thresholds
        run: npm run coverage

      - name: Build single-file bundle
        run: npm run build

      # `gh release create` fails if the release already exists (re-tagged or
      # re-run); fall back to uploading the freshly built bundle onto it.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" 2048.html \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" 2048.html --clobber
